# Validation only: no build, no signing, no secrets. scripts/validate.py says
# what is checked. A published release runs it again with --strict, when the
# assets the index names become downloadable.
name: validate

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every ref and all of history: no WAD and no key, ever.
          fetch-depth: 0
          # A release checks the index on the default branch, not at its tag.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Index, manifests, release assets, history
        run: python3 scripts/validate.py ${{ github.event_name == 'release' && '--strict' || '' }}

  installer-python38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: install.py runs on Python 3.8
        run: |
          python -m py_compile install.py scripts/validate.py
          python install.py --index index.json --list
